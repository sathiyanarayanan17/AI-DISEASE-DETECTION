<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#040812" />
    <meta name="description" content="EarlyAlert - AI Disease Outbreak Early Warning System for Tamil Nadu" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>EarlyAlert AI - Tamil Nadu Disease Risk Monitor</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: #040812;
        color: #e2e8f0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Leaflet light overrides */
      .leaflet-popup-content-wrapper {
        background: rgba(15,22,41,0.95) !important;
        color: #e2e8f0 !important;
        border: 1px solid rgba(99,102,241,0.25) !important;
        border-radius: 14px !important;
        box-shadow: 0 12px 40px rgba(0,0,0,0.6) !important;
        padding: 0 !important;
      }
      .leaflet-popup-content { margin: 14px 16px !important; }
      .leaflet-popup-tip-container { display: none !important; }
      .leaflet-popup-close-button { color: #64748b !important; font-size: 18px !important; top: 6px !important; right: 10px !important; }
      .leaflet-popup-close-button:hover { color: #e2e8f0 !important; background: none !important; }
      .leaflet-control-zoom a { background: rgba(10,15,30,0.9) !important; color: #94a3b8 !important; border-color: rgba(255,255,255,0.08) !important; }
      .leaflet-control-zoom a:hover { background: #1a2640 !important; color: #e2e8f0 !important; }
      .leaflet-control-attribution { background: rgba(4,8,18,0.8) !important; color: #334155 !important; font-size: 9px !important; }
      .leaflet-control-attribution a { color: #475569 !important; }
      
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.15); }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
