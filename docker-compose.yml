# ═══════════════════════════════════════════════════════════════════
# VyaadhiShield AI — Docker Compose (Full Stack)
# ═══════════════════════════════════════════════════════════════════
# Usage:
#   docker-compose up --build         (development)
#   docker-compose -f docker-compose.yml up -d   (production)
# ═══════════════════════════════════════════════════════════════════

version: "3.8"

services:
  # ─────────────────────────────────────────
  # FastAPI Backend + ML Model
  # ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vyaadhishield-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_PATH=/app/models/xgb_model.pkl
      - LOG_LEVEL=info
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vyaadhi-network

  # ─────────────────────────────────────────
  # React Frontend (Nginx)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vyaadhishield-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - vyaadhi-network

  # ─────────────────────────────────────────
  # Redis (for future caching/sessions)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vyaadhishield-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - vyaadhi-network

networks:
  vyaadhi-network:
    driver: bridge
